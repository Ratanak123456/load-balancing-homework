global_defs {
    router_id LB02
    script_user root
    enable_script_security
}

vrrp_script check_haproxy {
    script "/usr/local/sbin/check-haproxy.sh"
    interval 2
    timeout 3
    fall 2
    rise 2
    weight 0
    init_fail
}

vrrp_instance REACT_VIP {
    state BACKUP
    interface enp0s8
    virtual_router_id 51
    priority 100
    advert_int 1

    unicast_src_ip 192.168.56.11

    unicast_peer {
        192.168.56.10
    }

    virtual_ipaddress {
        192.168.56.100/24 dev enp0s8
    }

    track_script {
        check_haproxy
    }
}
