global
    log /dev/log local0
    log /dev/log local1 notice
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode http
    option httplog
    option dontlognull

    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout check 3s

frontend react_frontend
    bind *:80
    default_backend react_servers

backend react_servers
    balance roundrobin

    option httpchk GET /health
    http-check expect status 200

    default-server inter 2s fall 3 rise 2

    server web01 192.168.56.20:3000 check
    server web02 192.168.56.21:3000 check
